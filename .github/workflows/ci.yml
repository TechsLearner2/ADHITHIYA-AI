name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile-all:
    name: Syntax check (all files, no deps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Mark-LI-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile every .py file (catches syntax breaks incl. ui/main)
        run: |
          set -o pipefail
          find . -name "*.py" -not -path "*/node_modules/*" -print0 \
            | xargs -0 python -m py_compile
          echo "✔ all $(find . -name '*.py' | wc -l | tr -d ' ') modules compile"

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Mark-LI-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal test deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest openai psutil
      - name: Run test suite
        run: python -m pytest tests/ -q
